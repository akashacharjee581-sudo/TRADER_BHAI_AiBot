<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Update</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .update-container {
            text-align: center;
            padding: 30px;
            width: 90%;
            max-width: 450px;
        }

        /* বড় এবং রেড কালার UPDATE লেখা */
        .update-title {
            color: #ff3333;
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: 2px;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            animation: pulse 2s infinite;
        }

        /* ইংরেজিতে মেসেজ */
        .message-1 {
            font-size: 1.2rem;
            color: #e0e0e0;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .message-2 {
            font-size: 0.95rem;
            color: #a0a0a0;
            margin-bottom: 30px;
        }

        /* ছোট সাইজের টাইমার ডিসপ্লে */
        .timer-display {
            font-size: 2.2rem;
            font-weight: 600;
            color: #dddddd;
            font-variant-numeric: tabular-nums;
            margin-bottom: 20px;
        }

        .unit {
            font-size: 1.1rem;
            color: #ff3333;
            margin-left: 4px;
            font-weight: bold;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="update-container">
    <h1 class="update-title">UPDATE</h1>
    
    <div class="message-1">Updating, please wait...</div>
    <div class="message-2">It may take some time.</div>
    
    <!-- টাইমার ডিসপ্লে (যা ১৭২৪ থেকে বেড়ে চলতেই থাকবে) -->
    <div class="timer-display">
        <span id="secondsCount">1724</span><span class="unit">s</span>
    </div>
</div>

<script>
    function syncTimer() {
        // সব মোবাইলে একই সেকেন্ড দেখানোর জন্য একটি নির্দিষ্ট গ্লোবাল টাইম ফিক্সড করা হয়েছে
        const baseUnixTime = 1783253303; 
        const currentUnixTime = Math.floor(Date.now() / 1000);
        
        // ১৭২৪ থেকে শুরু হয়ে প্রতি সেকেন্ডে ১ করে বাড়তে থাকবে এবং কখনো থামবে না
        let continuousSeconds = 1724 + (currentUnixTime - baseUnixTime);
        
        // কোনো মোবাইলের টাইম জোন বা ইন্টারনেটে সামান্য অমিল থাকলেও যেন ১৭২৪ এর নিচে না নামে
        if (continuousSeconds < 1724) {
            continuousSeconds = 1724;
        }
        
        document.getElementById('secondsCount').textContent = continuousSeconds;
    }

    // প্রতি ১ সেকেন্ড পর পর টাইমার আপডেট হবে
    setInterval(syncTimer, 1000);

    // পেজ লোড হওয়ার সাথে সাথে রান করার জন্য
    syncTimer();
</script>

</body>
</html>
