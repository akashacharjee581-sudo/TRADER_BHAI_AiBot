<title>TRADER BHAI</title>
<style>
:root{--neon:#00ff41;--danger:#ff003c;--gold:#ffea00;--jackpot:#ff00ff;--bg:#050505}
*{font-weight:900!important;font-family:'Arial Black',sans-serif!important}
body{background:#050505;min-height:100vh;background-image:radial-gradient(ellipse at top,#0a1a0a 0%,#050505 70%)}

/* HEADER */
.header-container{text-align:center;padding:15px 10px}
.zigzag-name{font-size:26px;letter-spacing:3px;color:#fff;text-transform:uppercase;text-shadow:2px 2px var(--danger),-2px -2px var(--neon);animation:glitch 1.5s infinite}
@keyframes glitch{0%{transform:skew(0deg)}20%{transform:skew(-3deg)}40%{transform:skew(3deg)}100%{transform:skew(0deg)}}

/* GLASS BOX */
.glass-box{max-width:380px;margin:0 auto 15px;background:rgba(255,255,255,0.05);border:2px solid var(--neon);border-radius:20px;padding:15px;backdrop-filter:blur(15px);text-align:center;box-sizing:border-box}
input{width:100%;padding:12px;background:#000;border:2px solid #444;border-radius:10px;color:var(--neon);font-size:16px;margin:10px 0;outline:none;text-align:center;box-sizing:border-box}
.btn-main{width:100%;padding:14px;background:linear-gradient(45deg,var(--neon),#008f11);border:none;border-radius:10px;color:#000;font-size:16px;text-transform:uppercase;cursor:pointer}

/* GAME GRID */
.game-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}
.game-card{background:rgba(255,255,255,0.03);border:1.5px solid #333;border-radius:12px;padding:10px;text-align:center;cursor:pointer;transition:all 0.2s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.game-card:hover{border-color:var(--gold);background:rgba(255,234,0,0.05)}
.game-card img{width:70px;height:70px;border-radius:12px;object-fit:cover;border:1px solid rgba(255,255,255,0.2)}
.game-title{font-size:11px;color:#fff;text-transform:uppercase;letter-spacing:0.5px}

/* ACTIVE GAME BAR */
.active-game-bar{background:rgba(0,0,0,0.5);border:2px dashed var(--gold);border-radius:12px;padding:10px;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;text-align:left;backdrop-filter:blur(5px)}
.active-game-info{display:flex;align-items:center;gap:10px}
.active-game-info img{width:44px;height:44px;border-radius:10px}
.btn-launch{padding:8px 12px;background:var(--gold);color:#000;border:none;border-radius:6px;font-size:11px;text-transform:uppercase;cursor:pointer;box-shadow:0 0 10px var(--gold)}

/* DASHBOARD */
.fused-dashboard-container{display:flex;flex-direction:column;gap:15px;width:100%;margin-top:5px}
.prediction-isolated-box{background:rgba(0,0,0,0.35);border:2px solid var(--neon);border-radius:15px;padding:15px;box-shadow:inset 0 0 15px rgba(0,255,65,0.15);backdrop-filter:blur(6px);position:relative}
.pred-val{font-size:45px;margin:8px 0;text-shadow:0 0 20px var(--neon);color:#fff}
.period-box{color:#fff;font-size:14px;background:rgba(34,34,34,0.6);display:inline-block;padding:5px 15px;border-radius:15px;border:2px solid var(--gold)}
.sys-mode{color:var(--gold);font-size:10px;margin-top:5px;text-transform:uppercase;letter-spacing:1px}
.numbers-box{display:flex;justify-content:center;gap:15px;margin:12px 0 5px}
.number-circle{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;border:3px solid var(--gold);background:rgba(0,0,0,0.4)}
.big-number{border-color:var(--neon);color:var(--neon)}
.small-number{border-color:#ff5500;color:#ff5500}

/* JACKPOT */
.jackpot-text{color:var(--gold);font-size:22px;text-shadow:0 0 15px var(--gold),0 0 30px #ffa600;animation:pulse 0.6s infinite alternate;margin:8px 0;letter-spacing:2px}
.gold-line{border:none;height:4px;background:linear-gradient(90deg,transparent,var(--gold),#ffaa00,var(--gold),transparent);box-shadow:0 0 15px var(--gold);margin:10px 0;animation:goldGlow 1s infinite alternate}
@keyframes goldGlow{0%{opacity:0.6;box-shadow:0 0 10px var(--gold)}100%{opacity:1;box-shadow:0 0 25px #ffaa00}}

/* HISTORY */
.history-isolated-box{background:rgba(0,0,0,0.35);border:2px solid #333;border-radius:15px;padding:12px;box-sizing:border-box;backdrop-filter:blur(6px)}
table{width:100%;border-collapse:collapse;font-size:11px}
th{color:var(--gold);border-bottom:2px solid #444;padding:8px;background:rgba(255,255,255,0.05)}
td{padding:9px;border-bottom:1px solid rgba(255,255,255,0.1);text-align:center;color:#fff;background:rgba(0,0,0,0.2)}
.win{color:var(--neon)!important;text-shadow:0 0 5px var(--neon);background:rgba(0,255,65,0.05)!important}
.loss{color:var(--danger)!important;text-shadow:0 0 5px var(--danger);background:rgba(255,0,60,0.05)!important}
.jackpot-win{color:var(--gold)!important;background:rgba(255,234,0,0.15)!important;box-shadow:inset 0 0 12px rgba(255,234,0,0.4);border-top:2px solid var(--gold);border-bottom:2px solid var(--gold);text-shadow:0 0 8px var(--gold)}

/* SPLIT HINT */
.split-hint{background:rgba(255,234,0,0.1);border:1px dashed var(--gold);padding:8px;border-radius:8px;font-size:10px;color:#bbb;margin-top:10px;text-align:left}

/* SERVER OFF MODAL */
.server-off-modal{position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
.server-off-card{background:#111;border:2px solid var(--danger);border-radius:20px;padding:30px 24px;max-width:320px;width:100%;text-align:center;box-shadow:0 0 40px rgba(255,0,60,0.4)}

/* HIDDEN ADMIN */
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:999}
.admin-modal{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);width:95%;max-width:360px;background:#000;border:3px solid var(--gold);border-radius:20px;padding:20px;z-index:1000;box-shadow:0 -5px 30px rgba(255,234,0,0.4)}
select{width:100%;padding:12px;background:#111;color:#fff;border:2px solid var(--gold);border-radius:10px;font-size:14px;margin-bottom:15px;text-align:center}
.key-display{margin-top:15px;color:var(--neon);font-size:12px;word-break:break-all;border:2px dashed var(--neon);padding:10px;border-radius:8px;min-height:44px;display:flex;align-items:center;justify-content:center}
.gen-key-list{margin-top:10px;max-height:160px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.key-item{background:#111;border:1px solid var(--gold);border-radius:8px;padding:8px 10px;display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--neon)}
.copy-key-btn{padding:4px 10px;background:var(--gold);color:#000;border:none;border-radius:5px;font-size:10px;cursor:pointer}
.exp-badge{font-size:9px;color:#aaa}
.admin-close{background:transparent;color:#555;border:none;font-size:11px;cursor:pointer;margin-top:10px}

.hidden{display:none}
@keyframes pulse{0%{transform:scale(1)}100%{transform:scale(1.08)}}
</style>
